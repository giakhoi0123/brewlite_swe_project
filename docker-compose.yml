services:
  postgres:
    image: postgres:15-alpine
    container_name: brewlite-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - brewlite-auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-brewlite} -d ${POSTGRES_DB:-brewlite}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brewlite-auth-postgres:
